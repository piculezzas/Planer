<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lektionenplaner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" onerror="window.__lpSupabaseLoadFailed=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#fbeff0;
  --surface:#fffbfb;
  --surface-2:#f6e2e5;
  --border:#edced2;
  --text:#3c262a;
  --text-muted:#8f6a6f;
  --accent:#b5495f;
  --accent-strong:#8f3547;
  --accent-soft:#f4dbe1;
  --good:#7c9473;
  --good-soft:#e7ecdf;
  --warn:#bf8a4a;
  --warn-soft:#f7ecd8;
  --danger:#ab4a51;
  --danger-soft:#f5dcdd;
  --shadow:0 8px 24px rgba(120,40,58,.12), 0 2px 6px rgba(120,40,58,.07);
  --radius-s:12px;
  --radius-m:16px;
  --radius-l:22px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241418;
    --surface:#2f1c21;
    --surface-2:#3a232a;
    --border:#4a2c34;
    --text:#f4e4e6;
    --text-muted:#c99ca2;
    --accent:#e58fa1;
    --accent-strong:#f2b0bc;
    --accent-soft:#472530;
    --good:#9dba8f;
    --good-soft:#2c3527;
    --warn:#e0b15c;
    --warn-soft:#3a2e17;
    --danger:#e2917f;
    --danger-soft:#3a2420;
    --shadow:0 8px 24px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#241418;
  --surface:#2f1c21;
  --surface-2:#3a232a;
  --border:#4a2c34;
  --text:#f4e4e6;
  --text-muted:#c99ca2;
  --accent:#e58fa1;
  --accent-strong:#f2b0bc;
  --accent-soft:#472530;
  --good:#9dba8f;
  --good-soft:#2c3527;
  --warn:#e0b15c;
  --warn-soft:#3a2e17;
  --danger:#e2917f;
  --danger-soft:#3a2420;
  --shadow:0 8px 24px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size:14.5px;
  line-height:1.5;
}
[hidden]{display:none!important;}
img{max-width:100%;}
h1,h2,h3{font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0;}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
a{color:var(--accent-strong);}
button{font-family:inherit;font-size:inherit;}
textarea, input, select{font-family:inherit; font-size:inherit; color:var(--text);}
::selection{background:var(--accent-soft);}
.wrap{max-width:1760px;margin:0 auto;padding:0 24px 64px;}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); border-bottom:1px solid var(--border); padding-block:9px;}
.topbar-inner{max-width:1760px;margin:0 auto;padding:0 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.brand{display:flex; flex-direction:column; gap:2px; margin-right:auto;}
.brand h1{font-size:1.35rem; font-weight:600; letter-spacing:.2px;}
.brand .sub{font-size:.8rem; color:var(--text-muted);}
.brand .sub button{background:none;border:none;color:var(--text-muted);text-decoration:underline dotted;cursor:pointer;padding:0;font-size:inherit;}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-size:.78rem; font-weight:600; white-space:nowrap;}
.pill-edit{background:var(--good-soft); color:var(--good);}
.pill-view{background:var(--surface-2); color:var(--text-muted);}
.pill-local{background:var(--warn-soft); color:var(--warn);}
.pill-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.weeknav{display:flex; align-items:center; gap:8px;}
.weeknav .wk{font-family:"IBM Plex Mono",monospace; font-size:.85rem; min-width:190px; text-align:center;}
.weeknav .wk b{font-size:.95rem;}
.btn{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:var(--radius-s); padding:7px 13px; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:background .12s,border-color .12s;}
.btn:hover{border-color:var(--accent);}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.btn-icon{padding:7px 9px;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2); border-color:var(--surface-2);}
.btn-danger{color:var(--danger); border-color:var(--danger-soft);}
.btn-danger:hover{background:var(--danger-soft); border-color:var(--danger);}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.btn-sm{padding:5px 10px; font-size:.82rem;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 12px;}
.toolbar-spacer{flex:1;}
.timetable-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:12px; box-shadow:var(--shadow);}
.grid{display:grid; grid-template-columns: 90px repeat(var(--daycount,5), minmax(168px,1fr)); gap:6px; min-width:950px;}
.cell-corner{background:transparent;}
.day-head{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s); padding:8px 12px; text-align:left; position:sticky; top:0;}
.day-head .d-name{font-weight:700; font-size:.94rem;}
.day-head .d-date{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--text-muted);}
.day-head.is-today{box-shadow:inset 0 -3px 0 var(--accent);}
.daynote-input{width:100%; margin-top:4px; border:1px solid transparent; background:transparent; border-radius:var(--radius-s); padding:3px 5px; font-size:.72rem; color:var(--text-muted); resize:none; min-height:20px; font-family:inherit; transition:background .12s,border-color .12s;}
.daynote-input:hover{border-color:var(--border);}
.daynote-input:focus{border-color:var(--accent); background:var(--surface); color:var(--text); outline:none;}
.daynote-input.has-content{border-color:var(--border); background:var(--surface); color:var(--text); font-weight:700; padding:5px 7px;}
.daynote-view{margin-top:4px; font-size:.72rem; color:var(--text-muted); white-space:pre-wrap;}
.daynote-view.has-content{background:var(--surface); color:var(--text); font-weight:700; border:1px solid var(--border); border-radius:var(--radius-s); padding:5px 7px;}
.time-cell{padding:5px 9px; font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--text-muted); display:flex; flex-direction:column; justify-content:center; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s);}
.time-cell b{display:block; color:var(--text); font-size:.8rem; font-weight:600;}
.lesson-cell{position:relative; padding:6px 12px; min-height:54px; cursor:pointer; display:flex; flex-direction:column; justify-content:center; gap:2px; background:var(--surface); transition:background .1s; border:1px solid var(--border); border-radius:var(--radius-s);}
.lesson-cell:hover{background:var(--surface-2);}
.lesson-cell:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
.lesson-cell.is-empty-day{background:repeating-linear-gradient(135deg, var(--bg) 0 12px, var(--surface) 12px 24px); border-color:var(--bg); cursor:default; opacity:.6;}
.lesson-cell .subj{font-weight:600; font-size:.88rem;}
.lesson-cell .klasse{font-size:.74rem; color:var(--text-muted);}
.status-dot{position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; border:1.5px solid var(--text-muted); background:transparent;}
.status-dot.is-planned{background:var(--good); border-color:var(--good);}
.status-dot.is-taught{background:var(--accent); border-color:var(--accent);}
.status-dot.is-taught::after{content:"✓"; position:absolute; inset:-6px; display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--accent); font-weight:700;}
.lesson-cell.is-planned{background:var(--good-soft);}
.lesson-cell.is-planned:hover{filter:brightness(0.97);}
.lesson-cell.is-inprogress{background:repeating-linear-gradient(135deg, var(--good-soft) 0 10px, var(--surface) 10px 20px);}
.lesson-cell.is-inprogress:hover{filter:brightness(0.97);}
.lesson-cell.is-taught{background:var(--accent-soft);}
.lesson-cell.is-taught:hover{filter:brightness(0.97);}
.lesson-cell.has-mark{border-left-width:5px; border-left-style:solid;}
.mark-chip{display:inline-block; font-size:.65rem; font-weight:700; padding:1px 6px; border-radius:999px; border:1px solid; width:fit-content; line-height:1.4;}
.overlay{position:fixed; inset:0; background:rgba(20,24,22,.38); z-index:60; animation:fade .15s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}
.drawer{position:fixed; top:0; right:0; height:100%; width:min(460px,100%); background:var(--surface); z-index:61; box-shadow:var(--shadow); display:flex; flex-direction:column; transform:translateX(0); animation:slidein .18s ease; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
@keyframes slidein{from{transform:translateX(24px); opacity:.4} to{transform:translateX(0); opacity:1}}
.drawer-head{padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:10px;}
.drawer-head .ti{flex:1;}
.drawer-head h2{font-size:1.15rem;}
.drawer-head .meta{font-size:.8rem; color:var(--text-muted); margin-top:2px; font-family:"IBM Plex Mono",monospace;}
.drawer-body{flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:18px;}
.drawer-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center;}
.field label{display:block; font-weight:700; font-size:.8rem; margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted);}
.field .hint{font-size:.76rem; color:var(--text-muted); margin-top:4px;}
.field input[type=text], .field input[type=url], .field input[type=email], .field input[type=password], .field textarea, .field select, .field input[type=number]{width:100%; border:1px solid var(--border); border-radius:var(--radius-s); padding:8px 10px; background:var(--surface);}
.field textarea{resize:none; min-height:70px; overflow:hidden;}
.field input:disabled, .field textarea:disabled, .field select:disabled{background:var(--surface-2); color:var(--text-muted); cursor:not-allowed;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.lp21row{display:flex; gap:8px; align-items:flex-end;}
.lp21row .field{flex:1;}
.lp21-link-out{display:inline-flex; align-items:center; gap:5px; font-size:.82rem; margin-top:6px;}
.ablauf-row{display:grid; grid-template-columns:22px 60px 1fr 1fr 2fr auto; gap:6px; align-items:start; margin-bottom:8px;}
.ablauf-row input, .ablauf-row select, .ablauf-row textarea{width:100%; border:1px solid var(--border); border-radius:var(--radius-s); padding:6px 8px; background:var(--surface); font-size:.85rem;}
.ablauf-row textarea{min-height:36px; resize:none; overflow:hidden;}
.ablauf-head{display:grid; grid-template-columns:22px 60px 1fr 1fr 2fr auto; gap:6px; font-size:.7rem; text-transform:uppercase; letter-spacing:.3px; color:var(--text-muted); margin-bottom:6px;}
.ablauf-drag{cursor:grab; color:var(--text-muted); display:flex; align-items:center; justify-content:center; padding-top:6px; user-select:none;}
.ablauf-drag:active{cursor:grabbing;}
.ablauf-row.dragging{opacity:.4;}
.ablauf-row.drag-over{outline:2px dashed var(--accent); outline-offset:2px; border-radius:var(--radius-s);}
.ablauf-static{border-left:3px solid var(--accent-soft); padding:8px 0 8px 12px; margin-bottom:8px;}
.ablauf-static .ph{font-weight:700; font-size:.82rem;}
.ablauf-static .mi{font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--text-muted);}
.ablauf-static p{margin:4px 0 0; font-size:.86rem;}
.icon-btn{background:none; border:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:var(--radius-s);}
.icon-btn:hover{color:var(--danger); background:var(--danger-soft);}
.dialog-backdrop{position:fixed; inset:0; background:rgba(20,24,22,.42); z-index:70; display:flex; align-items:center; justify-content:center; padding:20px;}
.dialog{background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow); width:min(560px,100%); max-height:88vh; display:flex; flex-direction:column;}
.dialog-head{padding:18px 22px; border-bottom:1px solid var(--border);}
.dialog-head h2{font-size:1.1rem;}
.dialog-body{padding:18px 22px; overflow-y:auto; display:flex; flex-direction:column; gap:16px;}
.dialog-foot{padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end;}
.sched-day{border:1px solid var(--border); border-radius:var(--radius-m); padding:12px; margin-bottom:10px;}
.sched-day h3{font-size:.92rem; margin-bottom:8px;}
.sched-row{display:grid; grid-template-columns:70px 70px 1.4fr 1fr auto; gap:6px; margin-bottom:6px; align-items:center;}
.sched-row input{border:1px solid var(--border); border-radius:var(--radius-s); padding:5px 7px; background:var(--surface); font-size:.82rem; width:100%;}
.break-bar{background:repeating-linear-gradient(135deg, var(--surface-2) 0 8px, var(--surface) 8px 16px); display:flex; align-items:center; justify-content:center; font-size:.72rem; color:var(--text-muted); padding:6px 14px; letter-spacing:.3px; font-family:"IBM Plex Mono",monospace; border:1px solid var(--border); border-radius:var(--radius-s);}
.period-row{display:grid; grid-template-columns:70px 70px 100px 1fr auto; gap:6px; margin-bottom:6px; align-items:center;}
.period-row input, .period-row select{border:1px solid var(--border); border-radius:var(--radius-s); padding:5px 7px; background:var(--surface); font-size:.82rem; width:100%;}
.day-row-wrap{margin-bottom:10px;}
.day-row{display:grid; grid-template-columns:92px auto 1.4fr 1fr; gap:8px; margin-bottom:4px; align-items:center;}
.day-row .dr-subject, .day-row .dr-klasse{border:1px solid var(--border); border-radius:var(--radius-s); padding:5px 7px; background:var(--surface); font-size:.82rem; width:100%;}
.mark-row{display:flex; align-items:center; gap:8px; padding-left:100px; font-size:.76rem; color:var(--text-muted); flex-wrap:wrap;}
.mark-row .mark-toggle{display:flex; align-items:center; gap:5px; white-space:nowrap;}
.mark-row input[type=color]{width:26px; height:24px; padding:0; border:1px solid var(--border); border-radius:6px; background:var(--surface); cursor:pointer;}
.mark-row input[type=color]:disabled{opacity:.4; cursor:not-allowed;}
.mark-row input[type=text]{flex:1; min-width:120px; border:1px solid var(--border); border-radius:var(--radius-s); padding:4px 8px; background:var(--surface); font-size:.78rem;}
.mark-row input[type=text]:disabled{opacity:.4; cursor:not-allowed; background:var(--surface-2);}
.toast{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--accent-strong); color:#fff; padding:10px 18px; border-radius:999px; font-weight:600; font-size:.85rem; box-shadow:var(--shadow); z-index:90; animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0; transform:translate(-50%,8px)} to{opacity:1; transform:translate(-50%,0)}}
.banner{background:var(--warn-soft); color:var(--warn); border-radius:var(--radius-m); padding:10px 14px; font-size:.85rem; margin-bottom:16px; display:flex; gap:8px; align-items:center;}
.banner.err{background:var(--danger-soft); color:var(--danger);}
.print-sheet .ps-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--text); padding-bottom:10px; margin-bottom:16px;}
.print-sheet .ps-head h2{font-size:1.3rem;}
.print-sheet .ps-lesson{margin-bottom:14px; padding-top:12px;}
.print-sheet .ps-lesson:first-child{padding-top:0;}
.print-sheet .ps-lesson-card{border:1px solid var(--border); border-radius:var(--radius-m); padding:14px;}
.print-sheet .ps-lesson h3{font-size:1rem; margin-bottom:2px;}
.print-sheet .ps-lesson .ps-meta{font-size:.8rem; color:var(--text-muted); font-family:"IBM Plex Mono",monospace; margin-bottom:8px;}
.print-sheet .ps-field{margin-bottom:8px;}
.print-sheet .ps-field .l{font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted); margin-bottom:2px;}
.print-sheet .ps-field .v{font-size:.88rem; white-space:pre-wrap;}
.print-sheet table{width:100%; border-collapse:collapse; font-size:.82rem;}
.print-sheet table th, .print-sheet table td{border:1px solid var(--border); padding:5px 7px; text-align:left; vertical-align:top;}
@media (max-width:640px){
  .topbar-inner{gap:10px;}
  .weeknav .wk{min-width:0;}
  .row2{grid-template-columns:1fr;}
  .ablauf-row, .ablauf-head{grid-template-columns:1fr; }
  .sched-row{grid-template-columns:1fr 1fr; }
  .period-row{grid-template-columns:1fr 1fr; }
  .day-row{grid-template-columns:1fr 1fr; }
}
</style>
</head>

<script>
(function(){
"use strict";

/* ================= constants ================= */
var WEEKDAYS = [
  {key:"Mo", label:"Montag"},
  {key:"Di", label:"Dienstag"},
  {key:"Mi", label:"Mittwoch"},
  {key:"Do", label:"Donnerstag"},
  {key:"Fr", label:"Freitag"}
];
var PHASES = ["Einstieg","Erarbeitung","Übung/Vertiefung","Sicherung","Abschluss","Reflexion","Sonstiges"];
var SOZIALFORMEN = ["Plenum","EA","PA","GA"];
var LP21_PORTAL = "https://www.lehrplan.ch/";

/* ================= state ================= */
var state = null;

var mode = "loading";      // "loading" | "login" | "synced" | "shared" | "error"
var canEdit = false;
var bootError = null;
var dragState = { fromIdx: null };

var ui = {
  currentWeek: localStorage.getItem("lp_currentWeek") || isoWeekValueFromDate(new Date()),
  openDrawerKey: null,
  openDrawerDraft: null, // {key, fields} - keeps typed values visible if a save fails or a toast forces a re-render
  scheduleEditorOpen: false,
  exportDialog: null,   // "day" | "subject" | null
  printContent: null,   // {title, html}
  toast: null
};

/* ================= date / week helpers ================= */
function pad2(n){ return String(n).padStart(2,"0"); }

function isoWeekValueFromDate(date){
  var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  var dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  var firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  var firstDayNum = (firstThursday.getUTCDay()+6)%7;
  firstThursday.setUTCDate(firstThursday.getUTCDate()-firstDayNum+3);
  var weekNum = 1 + Math.round((d-firstThursday)/(7*864e5));
  return d.getUTCFullYear() + "-W" + pad2(weekNum);
}
function mondayFromWeekValue(value){
  var parts = value.split("-W");
  var year = parseInt(parts[0],10), week = parseInt(parts[1],10);
  var jan4 = new Date(Date.UTC(year,0,4));
  var jan4Day = (jan4.getUTCDay()+6)%7;
  var week1Monday = new Date(jan4); week1Monday.setUTCDate(jan4.getUTCDate()-jan4Day);
  var monday = new Date(week1Monday); monday.setUTCDate(week1Monday.getUTCDate() + (week-1)*7);
  return monday;
}
function addDaysUTC(date, days){ var d = new Date(date); d.setUTCDate(d.getUTCDate()+days); return d; }
function shiftWeekValue(value, deltaWeeks){
  var monday = mondayFromWeekValue(value);
  var shifted = addDaysUTC(monday, deltaWeeks*7);
  return isoWeekValueFromDate(shifted);
}
function fmtDateShort(d){ return pad2(d.getUTCDate())+"."+pad2(d.getUTCMonth()+1)+"."; }
function fmtDateLong(d){ return pad2(d.getUTCDate())+"."+pad2(d.getUTCMonth()+1)+"."+d.getUTCFullYear(); }
function dayIndexToDate(weekValue, dayIdx){ return addDaysUTC(mondayFromWeekValue(weekValue), dayIdx); }
function isSameUTCDate(a,b){ return a.getUTCFullYear()===b.getUTCFullYear() && a.getUTCMonth()===b.getUTCMonth() && a.getUTCDate()===b.getUTCDate(); }
function todayUTC(){ var n=new Date(); return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())); }
function weekLabel(weekValue){
  var monday = mondayFromWeekValue(weekValue);
  var friday = addDaysUTC(monday,4);
  var wk = weekValue.split("-W")[1];
  return {kw:wk, range: fmtDateShort(monday)+"–"+fmtDateShort(friday)+" "+monday.getUTCFullYear()};
}

/* ================= small utils ================= */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function escAttr(s){ return esc(s); }
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function on(root, evt, sel, handler){
  root.addEventListener(evt, function(e){
    var t = e.target.closest(sel);
    if(t && root.contains(t)) handler(e, t);
  });
}
function uid(){ return "id"+Math.random().toString(36).slice(2,10); }
function autoGrowTextarea(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
function autoGrowAll(root){
  qsa(".field textarea, .ablauf-row textarea", root).forEach(autoGrowTextarea);
}
function isValidUrl(u){
  if(!u) return false;
  try{ var url = new URL(u); return url.protocol==="http:"||url.protocol==="https:"; }catch(e){ return false; }
}
function lessonKey(week, day, periodId){ return week+"_"+day+"_"+periodId; }
function allPeriods(){ return state.periods || []; }
function lessonPeriods(){ return allPeriods().filter(function(p){ return p.type!=="break"; }); }
function getPeriodDef(periodId){ return allPeriods().filter(function(p){return p.id===periodId;})[0] || {start:"",end:""}; }
function getDayEntry(day, periodId){ return ((state.schedule && state.schedule[day]) || {})[periodId] || null; }
function getLesson(key){ return (state.lessons && state.lessons[key]) || null; }
function lessonStatus(lesson){
  if(!lesson) return "empty";
  if(lesson.taught) return "taught";
  var hasContent = (lesson.lernziele && lesson.lernziele.trim()) || (lesson.ablauf && lesson.ablauf.length) || (lesson.material && lesson.material.trim());
  if(!hasContent) return "empty";
  return lesson.inProgress ? "inprogress" : "planned";
}
function allSubjects(){
  var set = {};
  WEEKDAYS.forEach(function(d){
    Object.keys((state.schedule && state.schedule[d.key]) || {}).forEach(function(pid){
      var e = state.schedule[d.key][pid];
      if(e && e.subject) set[e.subject]=true;
    });
  });
  Object.keys(state.lessons||{}).forEach(function(k){ var l=state.lessons[k]; if(l && l.subject) set[l.subject]=true; });
  return Object.keys(set).sort(function(a,b){return a.localeCompare(b,"de");});
}

function withTimeout(promise, ms){
  return new Promise(function(resolve, reject){
    var timer = setTimeout(function(){ reject(new Error("Zeitüberschreitung")); }, ms);
    promise.then(function(v){ clearTimeout(timer); resolve(v); }, function(err){ clearTimeout(timer); reject(err); });
  });
}

// Runs a save action so its UI (button/dialog) can never get stuck: catches
// both synchronous throws and hangs, always calling onDone(false) instead.
function safeSave(fn, onDone){
  var p;
  try{ p = fn(); }catch(err){ p = Promise.reject(err); }
  withTimeout(Promise.resolve(p), 20000).then(function(ok){ onDone(ok); }, function(err){
    console.error(err);
    showToast("Speichern fehlgeschlagen. Bitte erneut versuchen.", true);
    onDone(false);
  });
}

function assembleState(metaRow, periodRows, cellRows, lessonRows, noteRows, libRows){
  var s = {
    version:1,
    meta:{
      schoolName:(metaRow&&metaRow.school_name)||"",
      teacherName:(metaRow&&metaRow.teacher_name)||"",
      className:(metaRow&&metaRow.class_name)||"",
      mentorName:(metaRow&&metaRow.mentor_name)||"",
      updatedAt:(metaRow&&metaRow.updated_at)||null
    },
    periods:(periodRows||[]).slice().sort(function(a,b){ return (a.sort_order||0)-(b.sort_order||0); }).map(function(p){
      return {id:p.id, start:p.start_time, end:p.end_time, type:p.type, label:p.label||""};
    }),
    schedule:{}, lessons:{}, dayNotes:{}, lp21Library:[]
  };
  WEEKDAYS.forEach(function(d){ s.schedule[d.key] = {}; });
  (cellRows||[]).forEach(function(c){
    if(!s.schedule[c.day]) s.schedule[c.day] = {};
    s.schedule[c.day][c.period_id] = {
      subject:c.subject||"", klasse:c.klasse||"", active:c.active!==false,
      mark: c.mark_color ? {color:c.mark_color, label:c.mark_label||""} : null
    };
  });
  (lessonRows||[]).forEach(function(l){
    s.lessons[lessonKey(l.week,l.day,l.period_id)] = {
      subject:l.subject||"", klasse:l.klasse||"", lp21Text:l.lp21_text||"", lp21Link:l.lp21_link||"",
      lernziele:l.lernziele||"", ablauf:l.ablauf||[], material:l.material||"", notizen:l.notizen||"",
      taught:!!l.taught, inProgress:!!l.in_progress, updatedAt:l.updated_at||null
    };
  });
  (noteRows||[]).forEach(function(n){ s.dayNotes[n.week+"_"+n.day] = n.note||""; });
  s.lp21Library = (libRows||[]).map(function(r){ return {id:r.id, label:r.label, link:r.link||""}; });
  return s;
}

function loadFullState(){
  return Promise.all([
    sb.from("meta").select("*").eq("id",1).maybeSingle(),
    sb.from("periods").select("*"),
    sb.from("schedule_cells").select("*"),
    sb.from("lessons").select("*"),
    sb.from("day_notes").select("*"),
    sb.from("lp21_library").select("*")
  ]).then(function(results){
    var errs = results.map(function(r){return r.error;}).filter(Boolean);
    if(errs.length) throw errs[0];
    state = assembleState(results[0].data, results[1].data, results[2].data, results[3].data, results[4].data, results[5].data);
  });
}

function loadSharedState(token){
  return sb.rpc("get_shared_plan", {p_token:token}).then(function(res){
    if(res.error) throw res.error;
    var d = res.data || {};
    var metaRow = (d.meta && d.meta[0]) || null;
    state = assembleState(metaRow, d.periods, d.schedule_cells, d.lessons, d.day_notes, d.lp21_library);
  });
}

function boot(){
  mode = "loading"; render();
  if(!sb){
    mode = "error"; bootError = "Die App konnte nicht vollständig geladen werden (Netzwerkproblem beim Laden der Skripte)."; render();
    return;
  }
  if(shareToken){
    withTimeout(loadSharedState(shareToken), 15000).then(function(){
      mode = "shared"; canEdit = false; render();
    }).catch(function(err){
      console.error(err);
      mode = "error"; bootError = "Dieser Link ist ungültig oder wurde widerrufen."; render();
    });
    return;
  }
  withTimeout(sb.auth.getSession(), 15000).then(function(res){
    var session = res.data && res.data.session;
    if(!session){ mode = "login"; render(); return; }
    return withTimeout(loadFullState(), 15000).then(function(){
      mode = "synced"; canEdit = true; render();
    });
  }).catch(function(err){
    console.error(err);
    mode = "error"; bootError = "Verbindung zur Datenbank fehlgeschlagen."; render();
  });
}

function doLogin(email, password){
  return sb.auth.signInWithPassword({email:email, password:password}).then(function(res){
    if(res.error) throw res.error;
    return loadFullState();
  }).then(function(){
    mode = "synced"; canEdit = true; render();
  });
}

function doLogout(){
  sb.auth.signOut().then(function(){
    state = null; mode = "login"; canEdit = false; render();
  });
}

var lessonWriteSeq = {}; // key -> sequence number of the most recently issued write (save or clear); guards against a late, stale response overwriting a newer one
function saveLesson(key, fields){
  var mySeq = (lessonWriteSeq[key] = (lessonWriteSeq[key]||0) + 1);
  var parts = key.split("_");
  var week = parts[0], day = parts[1], periodId = parts.slice(2).join("_");
  var nowIso = new Date().toISOString();
  var row = {
    week:week, day:day, period_id:periodId,
    subject:fields.subject, klasse:fields.klasse, lp21_text:fields.lp21Text, lp21_link:fields.lp21Link,
    lernziele:fields.lernziele, ablauf:fields.ablauf, material:fields.material, notizen:fields.notizen,
    taught:fields.taught, in_progress:fields.inProgress, updated_at:nowIso
  };
  var libStep = Promise.resolve();
  if(fields.lp21Text){
    var existing = (state.lp21Library||[]).filter(function(e){ return e.label===fields.lp21Text; })[0];
    if(existing){
      existing.link = fields.lp21Link;
      libStep = sb.from("lp21_library").update({link:fields.lp21Link}).eq("id", existing.id);
    } else {
      libStep = sb.from("lp21_library").insert({label:fields.lp21Text, link:fields.lp21Link}).select().single().then(function(res){
        if(res.error) throw res.error;
        state.lp21Library.push({id:res.data.id, label:res.data.label, link:res.data.link||""});
      });
    }
  }
  return Promise.all([
    sb.from("lessons").upsert(row, {onConflict:"week,day,period_id"}),
    libStep
  ]).then(function(results){
    if(results[0].error) throw results[0].error;
    if(lessonWriteSeq[key] === mySeq){
      state.lessons[key] = {subject:fields.subject, klasse:fields.klasse, lp21Text:fields.lp21Text, lp21Link:fields.lp21Link, lernziele:fields.lernziele, ablauf:fields.ablauf, material:fields.material, notizen:fields.notizen, taught:fields.taught, inProgress:fields.inProgress, updatedAt:nowIso};
    }
    showToast("Gespeichert ✓");
    return true;
  }).catch(function(err){
    console.error(err);
    showToast("Speichern fehlgeschlagen. Bitte erneut versuchen.", true);
    return false;
  });
}

function clearLesson(key){
  var mySeq = (lessonWriteSeq[key] = (lessonWriteSeq[key]||0) + 1);
  var parts = key.split("_");
  var week = parts[0], day = parts[1], periodId = parts.slice(2).join("_");
  return sb.from("lessons").delete().match({week:week, day:day, period_id:periodId}).then(function(res){
    if(res.error) throw res.error;
    if(lessonWriteSeq[key] === mySeq){
      delete state.lessons[key];
    }
    showToast("Zurückgesetzt");
    return true;
  }).catch(function(err){
    console.error(err);
    showToast("Zurücksetzen fehlgeschlagen.", true);
    return false;
  });
}

function saveDayNote(week, day, val){
  var key = week+"_"+day;
  if(val.trim()===""){
    return sb.from("day_notes").delete().match({week:week, day:day}).then(function(res){
      if(res.error) throw res.error;
      delete state.dayNotes[key];
    }).catch(function(err){ console.error(err); showToast("Speichern fehlgeschlagen.", true); });
  }
  return sb.from("day_notes").upsert({week:week, day:day, note:val}, {onConflict:"week,day"}).then(function(res){
    if(res.error) throw res.error;
    state.dayNotes[key] = val;
  }).catch(function(err){ console.error(err); showToast("Speichern fehlgeschlagen.", true); });
}

function saveSchedule(periods, schedule){
  return sb.from("periods").select("id").then(function(res){
    if(res.error) throw res.error;
    var existingIds = (res.data||[]).map(function(p){ return p.id; });
    var keepIds = periods.map(function(p){ return p.id; });
    var removedIds = existingIds.filter(function(id){ return keepIds.indexOf(id)===-1; });
    var removeStep = removedIds.length ? sb.from("periods").delete().in("id", removedIds) : Promise.resolve({error:null});
    return removeStep.then(function(rres){
      if(rres.error) throw rres.error;
      var periodRows = periods.map(function(p,i){ return {id:p.id, start_time:p.start, end_time:p.end, type:p.type, label:p.label||"", sort_order:i}; });
      return sb.from("periods").upsert(periodRows);
    });
  }).then(function(res){
    if(res.error) throw res.error;
    var cellRows = [];
    Object.keys(schedule).forEach(function(day){
      Object.keys(schedule[day]).forEach(function(pid){
        var e = schedule[day][pid];
        cellRows.push({day:day, period_id:pid, subject:e.subject||"", klasse:e.klasse||"", active:e.active!==false, mark_color:e.mark?e.mark.color:null, mark_label:e.mark?e.mark.label:null});
      });
    });
    return sb.from("schedule_cells").upsert(cellRows, {onConflict:"day,period_id"});
  }).then(function(res){
    if(res.error) throw res.error;
    state.periods = periods;
    state.schedule = schedule;
    showToast("Stundenplan gespeichert ✓");
    return true;
  }).catch(function(err){
    console.error(err);
    showToast("Speichern fehlgeschlagen.", true);
    return false;
  });
}

var toastTimer = null;
function showToast(msg, isErr){
  ui.toast = msg;
  render();
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    ui.toast = null;
    // just drop the toast node - a full render() here would blow away any
    // dialog that's open in the meantime (reset scroll, lose unsaved toggles)
    var el = qs(".toast");
    if(el) el.remove();
  }, 3200);
}

function renderInner(){
  var app = document.getElementById("app");
  if(mode === "loading"){ app.innerHTML = renderLoadingScreen(); return; }
  if(mode === "login"){ app.innerHTML = renderLoginScreen(); return; }
  if(mode === "error"){ app.innerHTML = renderErrorScreen(); return; }

  app.innerHTML = renderTopbar() + '<div class="wrap">' + renderToolbar() + renderTimetable() + '</div>';

  if(ui.openDrawerKey){ renderDrawerInto(app); }
  if(ui.scheduleEditorOpen){ renderScheduleDialogInto(app); }
  if(ui.exportDialog){ renderExportDialogInto(app); }
  if(ui.printContent){ renderPrintModalInto(app); }
  if(ui.settingsOpen){ renderSettingsDialogInto(app); }
  if(ui.toast){
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = ui.toast;
    app.appendChild(t);
  }
}

function renderTimetable(){
  var todayD = todayUTC();
  var html = '<div class="timetable-wrap"><div class="grid" style="--daycount:'+WEEKDAYS.length+'">';
  html += '<div class="cell-corner"></div>';
  WEEKDAYS.forEach(function(d, i){
    var date = dayIndexToDate(ui.currentWeek, i);
    var isToday = isSameUTCDate(date, todayD);
    var noteKey = ui.currentWeek+"_"+d.key;
    var noteVal = (state.dayNotes && state.dayNotes[noteKey]) || "";
    var noteHtml = canEdit
      ? '<textarea class="daynote-input'+(noteVal?' has-content':'')+'" data-week="'+ui.currentWeek+'" data-day="'+d.key+'" placeholder="Notiz (z. B. Sporttag, Feiertag)">'+esc(noteVal)+'</textarea>'
      : (noteVal ? '<div class="daynote-view has-content">'+esc(noteVal)+'</div>' : '');
    html += '<div class="day-head'+(isToday?' is-today':'')+'"><div class="d-name">'+d.label+'</div><div class="d-date mono">'+fmtDateLong(date)+'</div>'+noteHtml+'</div>';
  });

  allPeriods().forEach(function(period){
    if(period.type === "break"){
      html += '<div class="time-cell">'+esc(period.start)+'–'+esc(period.end)+'</div>';
      html += '<div class="break-bar" style="grid-column: span '+WEEKDAYS.length+';">'+esc(period.label||"Pause")+' · '+esc(period.start)+'–'+esc(period.end)+'</div>';
      return;
    }
    html += '<div class="time-cell"><b>'+esc(period.start)+'</b>'+esc(period.end)+'</div>';

    WEEKDAYS.forEach(function(d){
      var entry = getDayEntry(d.key, period.id);
      var active = !!entry && entry.active !== false;
      if(!active){
        html += '<div class="lesson-cell is-empty-day"></div>';
        return;
      }
      var key = lessonKey(ui.currentWeek, d.key, period.id);
      var lesson = getLesson(key);
      var subject = (lesson && lesson.subject) || entry.subject || "—";
      var klasse = (lesson && lesson.klasse) || entry.klasse || "";
      var status = lessonStatus(lesson);
      var cellStatusClass = status==="planned" ? " is-planned" : (status==="inprogress" ? " is-inprogress" : (status==="taught" ? " is-taught" : ""));
      var dotClass = (status==="planned"||status==="inprogress") ? " is-planned" : (status==="taught" ? " is-taught" : "");
      var mark = entry.mark || null;
      html += '<div class="lesson-cell'+cellStatusClass+(mark?' has-mark':'')+'" '+(mark?'style="border-left-color:'+escAttr(mark.color)+';"':'')+' tabindex="0" role="button" data-act="open-lesson" data-key="'+escAttr(key)+'" data-day="'+d.key+'" data-period="'+escAttr(period.id)+'" aria-label="'+escAttr(d.label+" "+subject)+(mark&&mark.label?(" – "+mark.label):"")+'"'+(mark&&mark.label?' title="'+escAttr(mark.label)+'"':'')+'>'+
        '<span class="status-dot'+dotClass+'"></span>'+
        '<span class="subj">'+esc(subject)+'</span>'+
        (klasse? '<span class="klasse">'+esc(klasse)+'</span>' : '')+
        (mark&&mark.label? '<span class="mark-chip" style="color:'+escAttr(mark.color)+';border-color:'+escAttr(mark.color)+';background:'+escAttr(mark.color)+'22;">'+esc(mark.label)+'</span>' : '')+
        '</div>';
    });
  });
  html += '</div></div>';
  return html;
}

function fieldValOr(lesson, field, fallback){
  if(lesson && lesson[field] != null && lesson[field] !== "") return lesson[field];
  return fallback || "";
}

function renderDrawerInto(app){
  var parts = ui.openDrawerKey.split("_");
  var week = parts[0], day = parts[1], periodId = parts[2];
  var periodDef = getPeriodDef(periodId);
  var dayEntry = getDayEntry(day, periodId) || {subject:"",klasse:""};
  var draft = ui.openDrawerDraft;
  var lesson = (draft && draft.key===ui.openDrawerKey) ? draft.fields : (getLesson(ui.openDrawerKey) || {});
  var dayLabel = WEEKDAYS.filter(function(d){return d.key===day;})[0].label;

function renderAblauf(ablauf, ro){

    if(!ablauf.length) return '<div class="hint">Kein Ablauf hinterlegt.</div>';
    return ablauf.map(function(row){
      return '<div class="ablauf-static"><div class="ph">'+esc(row.phase||"")+'</div>'+
        '<div class="mi">'+esc(row.minutes||"")+' Min. · '+esc(row.sozialform||"")+'</div>'+
        '<p>'+esc(row.beschreibung||"")+'</p></div>';

  }
  var head = '<div class="ablauf-head"><span></span><span>Min.</span><span>Phase</span><span>Sozialform</span><span>Beschreibung</span><span></span></div>';
  var rows = ablauf.map(function(row, i){
    return '<div class="ablauf-row" data-idx="'+i+'">'+
      '<span class="ablauf-drag" draggable="true" title="Ziehen zum Verschieben" aria-label="Sequenz verschieben">⠿</span>'+

      '<select class="ab-phase">'+PHASES.map(function(p){return '<option '+(p===row.phase?'selected':'')+'>'+p+'</option>';}).join("")+'</select>'+
      '<select class="ab-sozial">'+SOZIALFORMEN.map(function(s){return '<option '+(s===row.sozialform?'selected':'')+'>'+s+'</option>';}).join("")+'</select>'+

function buildDayExport(dateVal, filter){
  var d = new Date(dateVal+"T00:00:00Z");
  var jsDay = d.getUTCDay();
  var mondayOffset = (jsDay+6)%7;
  var monday = addDaysUTC(d, -mondayOffset);
  var weekVal = isoWeekValueFromDate(d);
  var dayIdx = mondayOffset;
  if(dayIdx > 4){
    return {title:"Tagesübersicht", filename:"Tagesübersicht_"+fmtDateLong(d), html:'<div class="print-sheet"><p>An Wochenenden sind keine Lektionen geplant.</p></div>'};
  }
  var dayKey = WEEKDAYS[dayIdx].key;
  var noteVal = (state.dayNotes && state.dayNotes[weekVal+"_"+dayKey]) || "";
  var blocks = lessonPeriods().map(function(p){
    var entry = getDayEntry(dayKey, p.id);
    if(!entry || entry.active===false) return "";
    var key = lessonKey(weekVal, dayKey, p.id);
    var lesson = getLesson(key);
    if(filter === "planned" && lessonStatus(lesson) === "empty") return "";
    var subject = (lesson && lesson.subject) || entry.subject;
    var klasse = (lesson && lesson.klasse) || entry.klasse;
    return lessonPrintBlock(subject, klasse, fmtDateLong(d), p.start+"–"+p.end, lesson);
  }).join("");
  var m = state.meta||{};
  var emptyMsg = filter === "planned" ? "Keine geplanten/durchgeführten Lektionen an diesem Tag." : "Keine Lektionen an diesem Tag.";
  return {
    title:"Tagesübersicht",
    filename:"Tagesübersicht_"+fmtDateLong(d),
    html:'<div class="print-sheet"><div class="ps-head"><h2>'+WEEKDAYS[dayIdx].label+', '+fmtDateLong(d)+'</h2><div class="mono">'+esc(m.teacherName||"")+(m.className?(' · Kl. '+esc(m.className)):'')+'</div></div>'+
      (noteVal ? '<div class="ps-field"><div class="l">Tagesnotiz</div><div class="v">'+esc(noteVal)+'</div></div>' : '')+
      (blocks || '<p>'+emptyMsg+'</p>')+'</div>'
  };
}

function buildSubjectExport(subject, fromWeek, toWeek, filter){
  var monday = mondayFromWeekValue(fromWeek);
  var endMonday = mondayFromWeekValue(toWeek);
  var blocks = [];
  var guard = 0;
  while(monday <= endMonday && guard < 60){
    var wv = isoWeekValueFromDate(monday);
    WEEKDAYS.forEach(function(d, idx){
      lessonPeriods().forEach(function(p){
        var entry = getDayEntry(d.key, p.id);
        if(!entry || entry.active===false) return;
        var effSubject = entry.subject;
        var key = lessonKey(wv, d.key, p.id);
        var lesson = getLesson(key);
        if(lesson && lesson.subject) effSubject = lesson.subject;
        if(effSubject !== subject) return;
        if(filter === "planned" && lessonStatus(lesson) === "empty") return;
        var date = addDaysUTC(monday, idx);
        blocks.push(lessonPrintBlock(effSubject, (lesson&&lesson.klasse)||entry.klasse, fmtDateLong(date), p.start+"–"+p.end, lesson));
      });
    });
    monday = addDaysUTC(monday, 7);
    guard++;
  }
  var m = state.meta||{};
  var emptyMsg = filter === "planned" ? "Keine geplanten/durchgeführten Lektionen im gewählten Zeitraum." : "Keine Lektionen im gewählten Zeitraum.";
  var rangeStart = mondayFromWeekValue(fromWeek);
  var rangeEnd = addDaysUTC(mondayFromWeekValue(toWeek), 4);
  return {
    title:"Fachübersicht",
    filename:"Fachübersicht_"+subject+"_"+fmtDateLong(rangeStart)+"-"+fmtDateLong(rangeEnd),
    html:'<div class="print-sheet"><div class="ps-head"><h2>'+esc(subject)+'</h2><div class="mono">'+esc(m.teacherName||"")+(m.className?(' · Kl. '+esc(m.className)):'')+'</div></div>'+
      (blocks.length ? blocks.join("") : '<p>'+emptyMsg+'</p>')+'</div>'
  };
}

// Editing a lesson's content implies it's (still) in progress - only an
// explicit, deliberate uncheck marks it as finished.
function autoMarkInProgress(){
  var box = qs("#f-inprogress");
  if(box && !box.checked) box.checked = true;
}
function wireEvents(app){
  on(app, "click", "[data-act]", function(e, t){
    var act = t.getAttribute("data-act");
    handleAction(act, e, t);
  });
  on(app, "keydown", ".lesson-cell", function(e, t){
    if(e.key==="Enter" || e.key===" "){ e.preventDefault(); t.click(); }
  });
  on(app, "input", ".lesson-dialog .dialog-body input, .lesson-dialog .dialog-body select, .lesson-dialog .dialog-body textarea", function(e, t){
    if(t.id==="f-inprogress" || t.id==="f-taught") return;
    autoMarkInProgress();
  });
  on(app, "change", ".lesson-dialog .dialog-body select", function(e, t){
    autoMarkInProgress();
  });
  on(app, "change", "#f-lp21-pick", function(e, t){
    var id = t.value;
    if(!id) return;
    var entry = (state.lp21Library||[]).filter(function(e){return e.id===id;})[0];
    if(!entry) return;
    var textEl = qs("#f-lp21text"), linkEl = qs("#f-lp21link");
    if(textEl) textEl.value = entry.label;
    if(linkEl) linkEl.value = entry.link||"";
  });
  on(app, "focusout", ".daynote-input", function(e, t){
    var week = t.getAttribute("data-week");
    var day = t.getAttribute("data-day");
    var val = t.value;
    var key = week+"_"+day;
    var current = (state.dayNotes && state.dayNotes[key]) || "";
    if(val === current) return;
    saveDayNote(week, day, val);
  });
  on(app, "input", ".daynote-input", function(e, t){
    t.classList.toggle("has-content", t.value.trim()!=="");
  });
  on(app, "input", ".field textarea, .ablauf-row textarea", function(e, t){
    autoGrowTextarea(t);
  });
  on(app, "change", ".dr-mark-on", function(e, t){
    var wrap = t.closest(".day-row-wrap");
    var on = t.checked;
    qs(".dr-mark-color", wrap).disabled = !on;
    qs(".dr-mark-label", wrap).disabled = !on;
  });
  on(app, "dragstart", ".ablauf-drag", function(e, t){
    var row = t.closest(".ablauf-row");
    dragState.fromIdx = parseInt(row.getAttribute("data-idx"),10);
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", String(dragState.fromIdx)); }catch(err){}
  });
  on(app, "dragend", ".ablauf-drag", function(e, t){
    var row = t.closest(".ablauf-row");
    if(row) row.classList.remove("dragging");
    qsa(".ablauf-row.drag-over", app).forEach(function(r){ r.classList.remove("drag-over"); });
    dragState.fromIdx = null;
  });
  on(app, "dragover", ".ablauf-row", function(e, t){
    if(dragState.fromIdx==null) return;
    e.preventDefault();
    t.classList.add("drag-over");
  });
  on(app, "dragleave", ".ablauf-row", function(e, t){
    t.classList.remove("drag-over");
  });
  on(app, "drop", ".ablauf-row", function(e, t){
    if(dragState.fromIdx==null) return;
    e.preventDefault();
    t.classList.remove("drag-over");
    var toIdx = parseInt(t.getAttribute("data-idx"),10);
    var fromIdx = dragState.fromIdx;
    if(fromIdx===toIdx) return;
    var drawer = qs(".lesson-dialog");
    var rows = collectAblaufFromDom(drawer);
    var moved = rows.splice(fromIdx,1)[0];
    rows.splice(toIdx,0,moved);
    reRenderAblauf(rows);
  });
  app.addEventListener("submit", function(e){
    var form = e.target.closest("#login-form");
    if(!form) return;
    e.preventDefault();
    var email = qs("#li-email", form).value.trim();
    var password = qs("#li-password", form).value;
    var btn = qs('button[type="submit"]', form);
    btn.disabled = true; btn.textContent = "Anmelden…";
    doLogin(email, password).catch(function(err){
      ui.loginError = (err && err.message) || "Anmeldung fehlgeschlagen.";
      render();
    });
  });
}

function handleAction(act, e, t){
  if(act==="open-lesson"){
    ui.openDrawerKey = t.getAttribute("data-key");
    ui.openDrawerDraft = null;
    render();
  } else if(act==="close-drawer"){
    if(e.target !== t) return;
    ui.openDrawerDraft = null;
    ui.openDrawerKey = null; render();
  } else if(act==="save-lesson"){
    var drawer = qs(".lesson-dialog");
    var key = drawer.dataset.key;
    var subject = qs("#f-subject").value.trim();
    var klasse = qs("#f-klasse").value.trim();
    var lp21Text = qs("#f-lp21text").value.trim();
    var lp21Link = qs("#f-lp21link").value.trim();
    var lernziele = qs("#f-ziele").value;
    var material = qs("#f-material").value;
    var notizen = qs("#f-notizen").value;
    var taughtEl = qs("#f-taught");
    var taught = taughtEl ? taughtEl.checked : false;
    var inProgressEl = qs("#f-inprogress");
    var inProgress = inProgressEl ? inProgressEl.checked : false;
    var ablauf = collectAblaufFromDom(drawer);
    var fields = {subject:subject, klasse:klasse, lp21Text:lp21Text, lp21Link:lp21Link, lernziele:lernziele, ablauf:ablauf, material:material, notizen:notizen, taught:taught, inProgress:inProgress};
    ui.openDrawerDraft = {key:key, fields:fields};
    t.disabled = true; t.textContent = "Speichert…";
    safeSave(function(){ return saveLesson(key, fields); }, function(ok){
      if(ok){ ui.openDrawerKey = null; ui.openDrawerDraft = null; }
      render();
    });
  } else if(act==="clear-lesson"){
    var drawer2 = qs(".lesson-dialog");
    var key2 = drawer2.dataset.key;
    if(confirm("Diese Lektionsplanung wirklich zurücksetzen?")){
      safeSave(function(){ return clearLesson(key2); }, function(ok){
        if(ok){ ui.openDrawerKey = null; }
        render();
      });
    }
  } else if(act==="ablauf-add"){
    var drawer3 = qs(".lesson-dialog");
    var rows = collectAblaufFromDom(drawer3);
    rows.push({minutes:5, phase:PHASES[0], sozialform:SOZIALFORMEN[0], beschreibung:""});
    reRenderAblauf(rows);
    autoMarkInProgress();
  } else if(act==="ablauf-remove"){
    var drawer4 = qs(".lesson-dialog");
    var rows2 = collectAblaufFromDom(drawer4);
    rows2.splice(parseInt(t.getAttribute("data-idx"),10),1);
    reRenderAblauf(rows2);
    autoMarkInProgress();
  } else if(act==="lp21-lib-remove"){
    var libId = t.getAttribute("data-id");
    removeLibEntry(libId);
  } else if(act==="logout"){
    doLogout();
  } else if(act==="open-settings"){
    ui.settingsOpen = true; render();
  } else if(act==="close-settings"){
    if(e.target !== t) return;
    ui.settingsOpen = false; render();
  } else if(act==="save-settings"){
    var teacher = qs("#s-teacher").value.trim();
    var klasseS = qs("#s-klasse").value.trim();
    var school = qs("#s-school").value.trim();
    var mentor = qs("#s-mentor").value.trim();
    t.disabled = true; t.textContent = "Speichert…";
    safeSave(function(){ return saveSettingsRemote({teacherName:teacher, className:klasseS, schoolName:school, mentorName:mentor}); }, function(ok){
      if(ok){ ui.settingsOpen = false; }
      render();
    });
  } else if(act==="open-schedule"){
    ui.pendingPeriods = JSON.parse(JSON.stringify(state.periods||[]));
    ui.pendingSchedule = JSON.parse(JSON.stringify(state.schedule||{}));
    ui.scheduleEditorOpen = true; render();
  } else if(act==="close-schedule"){
    if(e.target !== t) return;
    ui.scheduleEditorOpen = false; ui.pendingPeriods = null; ui.pendingSchedule = null; render();
  } else if(act==="period-add"){
    syncScheduleDialogFromDom();
    ui.pendingPeriods.push({id:uid(), start:"", end:"", type:"lesson", label:""});
    renderScheduleBodyOnly();
  } else if(act==="period-remove"){
    syncScheduleDialogFromDom();
    var idx = parseInt(t.getAttribute("data-idx"),10);
    ui.pendingPeriods.splice(idx,1);
    renderScheduleBodyOnly();
  } else if(act==="save-schedule"){
    syncScheduleDialogFromDom();
    var finalPeriods = ui.pendingPeriods;
    var finalSchedule = ui.pendingSchedule;
    t.disabled = true; t.textContent = "Speichert…";
    safeSave(function(){ return saveSchedule(finalPeriods, finalSchedule); }, function(ok){
      if(ok){ ui.scheduleEditorOpen = false; ui.pendingPeriods = null; ui.pendingSchedule = null; }
      render();
    });
  } else if(act==="reload-page"){
    location.reload();
  } else if(act==="open-export"){
    ui.exportDialog = "day"; render();
  } else if(act==="close-export"){
    if(e.target !== t) return;
    ui.exportDialog = null; render();
  } else if(act==="export-tab-day"){
    var fElA = qs('input[name="exp-filter"]:checked');
    if(fElA) ui.exportFilter = fElA.value;
    ui.exportDialog = "day"; render();
  } else if(act==="export-tab-subject"){
    var fElB = qs('input[name="exp-filter"]:checked');
    if(fElB) ui.exportFilter = fElB.value;
    ui.exportDialog = "subject"; render();
  } else if(act==="export-generate"){
    var fElC = qs('input[name="exp-filter"]:checked');
    var filterVal = fElC ? fElC.value : (ui.exportFilter||"all");
    ui.exportFilter = filterVal;
    var dialogKind = ui.exportDialog;
    var dateVal = dialogKind === "day" ? qs("#exp-date").value : null;
    var subj = dialogKind === "subject" ? qs("#exp-subject").value : null;
    var from = dialogKind === "subject" ? qs("#exp-from").value : null;
    var to = dialogKind === "subject" ? qs("#exp-to").value : null;
    t.disabled = true; t.textContent = "Aktualisiere…";
    var refreshStep = mode === "shared" ? loadSharedState(shareToken) : loadFullState();
    refreshStep.then(function(){
      if(dialogKind === "day"){
        if(dateVal){ ui.printContent = buildDayExport(dateVal, filterVal); }
      } else {
        if(subj && from && to){ ui.printContent = buildSubjectExport(subj, from, to, filterVal); }
      }
      ui.exportDialog = null;
      render();
    }).catch(function(err){
      console.error(err);
      showToast("Aktualisieren fehlgeschlagen. Bitte erneut versuchen.", true);
      t.disabled = false; t.textContent = "Vorschau erstellen";
    });
  } else if(act==="close-print"){
    if(e.target !== t) return;
    ui.printContent = null; render();
  } else if(act==="do-print"){
    doPrint();
  } else if(act==="week-prev"){
    ui.currentWeek = shiftWeekValue(ui.currentWeek, -1);
    persistUiWeek(); render();
  } else if(act==="week-next"){
    ui.currentWeek = shiftWeekValue(ui.currentWeek, 1);
    persistUiWeek(); render();
  } else if(act==="week-today"){
    ui.currentWeek = isoWeekValueFromDate(new Date());
    persistUiWeek(); render();
  }
}

function persistUiWeek(){ try{ localStorage.setItem("lp_currentWeek", ui.currentWeek); }catch(e){} }

function reRenderAblauf(rows){
  var drawer = qs(".lesson-dialog");
  // find the ablauf field by matching its label text
  var fields = qsa(".dialog-body .field", drawer);
  var target = fields.filter(function(f){ return qs("label",f) && qs("label",f).textContent==="Ablauf"; })[0];
  if(!target) return;
  var addBtn = target.querySelector('[data-act="ablauf-add"]');
  var html = renderAblauf(rows, false);
  target.innerHTML = '<label>Ablauf</label>' + html + (addBtn ? '<button type="button" class="btn btn-sm" data-act="ablauf-add">+ Sequenz hinzufügen</button>' : '');
  autoGrowAll(target);
}

function syncScheduleDialogFromDom(){
  var periodRows = qsa("#periods-body .period-row");
  var periods = periodRows.map(function(row){
    var idx = parseInt(row.getAttribute("data-idx"),10);
    var existing = (ui.pendingPeriods||[])[idx];
    return {
      id: (existing && existing.id) || uid(),
      start: qs(".pd-start", row).value.trim(),
      end: qs(".pd-end", row).value.trim(),
      type: qs(".pd-type", row).value,
      label: qs(".pd-label", row).value.trim()
    };
  });
  ui.pendingPeriods = periods;

  var schedule = {};
  WEEKDAYS.forEach(function(d){ schedule[d.key] = {}; });
  qsa(".day-row-wrap").forEach(function(wrap){
    var day = wrap.getAttribute("data-day");
    var pid = wrap.getAttribute("data-period-id");
    var markOn = qs(".dr-mark-on", wrap).checked;
    var markLabel = qs(".dr-mark-label", wrap).value.trim();
    schedule[day][pid] = {
      subject: qs(".dr-subject", wrap).value.trim(),
      klasse: qs(".dr-klasse", wrap).value.trim(),
      active: qs(".dr-active", wrap).checked,
      mark: markOn ? {color: qs(".dr-mark-color", wrap).value, label: markLabel} : null
    };
  });
  ui.pendingSchedule = schedule;
}

function renderScheduleBodyOnly(){
  var app = document.getElementById("app");
  var existingBackdrop = qs(".dialog-backdrop:not(.print-modal-backdrop)");
  if(existingBackdrop) existingBackdrop.remove();
  renderScheduleDialogInto(app);
}

/* ================= init ================= */
wireEvents(document.getElementById("app")); // once - #app is a stable node across renders, event delegation handles the rest
boot();

})();
</script>
</body>
